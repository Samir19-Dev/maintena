spring:
  application:
    name: maintena-backend
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${ATTACHMENT_MAX_SIZE:5MB}
      max-request-size: ${ATTACHMENT_MAX_REQUEST:6MB}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Maintena
    description: Plataforma de gestión de mantenimiento y órdenes de trabajo
    version: 0.0.1

app:
  jwt:
    secret: ${JWT_SECRET:change_me_in_prod_very_long_secret_key}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:86400000}
  security:
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lock-duration-minutes: ${LOGIN_LOCK_MINUTES:15}
    password-reset:
      token-expiration-minutes: ${PASSWORD_RESET_MINUTES:30}
      request-cooldown-seconds: ${PASSWORD_RESET_COOLDOWN:60}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@maintena.local}
  attachments:
    dir: ${ATTACHMENT_DIR:uploads}
    max-size-bytes: ${ATTACHMENT_MAX_BYTES:5242880}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

logging:
  level:
    com.maintena: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
