services:
  mysql:
    image: mysql:8.4
    container_name: maintena-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: maintena_db
      MYSQL_USER: maintena_user
      MYSQL_PASSWORD: maintena_pass
    ports:
      - "3306:3306"
    volumes:
      - maintena_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      timeout: 20s
      retries: 10

volumes:
  maintena_mysql_data:
