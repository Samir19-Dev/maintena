services:
  mysql:
    image: mysql:8.4
    container_name: maintena-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-maintena_db}
      MYSQL_USER: ${MYSQL_USER:-maintena_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-maintena_pass}
    ports:
      - "3306:3306"
    volumes:
      - maintena_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maintena-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-maintena_db}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-ZmFzdGVyLXNlY3JldC1rZXktZm9yLW1haW50ZW5hLWFwcC0yMDI2LXNlY3VyZS1rZXk=}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-86400000}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@maintena.local}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:8081}
      # Origen del frontend publicado en GitHub Pages (además de los locales).
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8081,https://samir19-dev.github.io}
      PASSWORD_RESET_MINUTES: ${PASSWORD_RESET_MINUTES:-30}
      PASSWORD_RESET_COOLDOWN: ${PASSWORD_RESET_COOLDOWN:-60}
      ATTACHMENT_DIR: /app/uploads
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-5242880}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - maintena_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: maintena-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

  mailpit:
    image: axllent/mailpit:latest
    container_name: maintena-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  maintena_mysql_data:
  maintena_uploads:
